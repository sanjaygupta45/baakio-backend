spring.datasource.url=jdbc:h2:mem:baakio-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.session.jdbc.initialize-schema=always

baakio.frontend-origin=http://localhost:5173
baakio.auth.otp.hash-secret=baakio-test-only-otp-hash-secret
baakio.auth.email.enabled=false
baakio.auth.legacy-phone-enabled=true
baakio.scan.messaging.enabled=false
baakio.scan.scheduling.enabled=false
