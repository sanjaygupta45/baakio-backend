# Local database; environment values from Compose override these defaults when provided.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_HOST_PORT:3307}/${MYSQL_DATABASE:baakio}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:${MYSQL_USER:baakio}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:baakio-local-change-this}}

baakio.scan.messaging.enabled=${SCAN_MESSAGING_ENABLED:false}
baakio.scan.scheduling.enabled=${SCAN_SCHEDULING_ENABLED:true}

# Local browser origin and cookie policy.
baakio.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Shared defaults for all Spring-managed HTTP clients.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s

# Development OTP secret/code only; replace the secret outside local development.
baakio.auth.otp.hash-secret=${OTP_HASH_SECRET:baakio-local-development-otp-pepper}
baakio.auth.otp.expires-seconds=${OTP_EXPIRES_SECONDS:300}
baakio.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
baakio.auth.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
baakio.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
baakio.auth.otp.development-code=${OTP_DEV_CODE:222222}
baakio.auth.otp.expose-development-code=true
baakio.auth.email.enabled=${EMAIL_AUTH_ENABLED:true}
baakio.auth.legacy-phone-enabled=${LEGACY_PHONE_AUTH_ENABLED:true}
baakio.notifications.otp-channel=${OTP_CHANNEL:SMS}

# Development provider prevents live SMS, WhatsApp, and email sends.
baakio.notifications.routing.sms-provider=${SMS_NOTIFICATION_PROVIDER:development}
baakio.notifications.routing.email-provider=${EMAIL_NOTIFICATION_PROVIDER:development}
baakio.notifications.routing.whatsapp-provider=${WHATSAPP_NOTIFICATION_PROVIDER:development}

# Optional provider settings; live credentials default empty and are not needed by the dev provider.
baakio.notifications.fast2sms.base-url=${FAST2SMS_BASE_URL:https://www.fast2sms.com}
baakio.notifications.fast2sms.api-key=${FAST2SMS_API_KEY:}
baakio.notifications.fast2sms.otp-template-id=${FAST2SMS_OTP_TEMPLATE_ID:}
baakio.notifications.fast2sms.otp-variables-template=${FAST2SMS_OTP_VARIABLES_TEMPLATE:}
baakio.notifications.fast2sms.quick-sms-route=${FAST2SMS_QUICK_SMS_ROUTE:q}
baakio.notifications.fast2sms.whatsapp-version=${FAST2SMS_WHATSAPP_VERSION:v26.0}
baakio.notifications.fast2sms.whatsapp-phone-number-id=${FAST2SMS_WHATSAPP_PHONE_NUMBER_ID:}
baakio.notifications.fast2sms.whatsapp-otp-template-name=${FAST2SMS_WHATSAPP_OTP_TEMPLATE_NAME:}
baakio.notifications.fast2sms.whatsapp-otp-button-index=${FAST2SMS_WHATSAPP_OTP_BUTTON_INDEX:}
baakio.notifications.email.from=${NOTIFICATION_EMAIL_FROM:}
