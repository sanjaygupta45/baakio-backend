spring.application.name=baakio
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=12h
spring.session.jdbc.initialize-schema=never

# Production database connection; supply all three DB_* settings from the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.default-property-inclusion=non_null

# Shared defaults for all Spring-managed HTTP clients.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s

# SMTP uses STARTTLS on port 587 for the production email provider.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:baakio}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:baakio-local-rabbit}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

baakio.scan.messaging.enabled=${SCAN_MESSAGING_ENABLED:true}
baakio.scan.scheduling.enabled=${SCAN_SCHEDULING_ENABLED:true}
baakio.scan.messaging.poll-ms=${SCAN_OUTBOX_POLL_MS:1000}
baakio.scan.recovery-poll-ms=${SCAN_RECOVERY_POLL_MS:60000}
baakio.scan.retention-days=${SCAN_RETENTION_DAYS:30}
baakio.scan.cleanup-cron=${SCAN_CLEANUP_CRON:0 15 3 * * *}
baakio.scan.mistral.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai}
baakio.scan.mistral.api-key=${MISTRAL_API_KEY:}
baakio.scan.mistral.model=${MISTRAL_OCR_MODEL:mistral-ocr-latest}

baakio.storage.gcs.project-id=${GCP_PROJECT_ID}
baakio.storage.gcs.bucket=${GCS_BUCKET}

baakio.frontend-origin=${FRONTEND_ORIGIN}
baakio.frontend-additional-origin=${FRONTEND_ADDITIONAL_ORIGIN:}
baakio.frontend-url=${FRONTEND_URL:https://www.baakio.shop}

# Required production secret used to hash OTP codes before they are stored.
baakio.auth.otp.hash-secret=${OTP_HASH_SECRET}
baakio.auth.otp.expires-seconds=${OTP_EXPIRES_SECONDS:300}
baakio.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
baakio.auth.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
baakio.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}


baakio.auth.otp.expose-development-code=false
baakio.auth.google.client-id=${GOOGLE_CLIENT_ID:}
baakio.auth.email.enabled=${EMAIL_AUTH_ENABLED:false}
baakio.auth.email.max-requests-per-day=${EMAIL_MAX_REQUESTS_PER_DAY:80}
baakio.auth.legacy-phone-enabled=${LEGACY_PHONE_AUTH_ENABLED:false}
baakio.notifications.otp-channel=${OTP_CHANNEL:SMS}


# Provider ID selected for each channel; each value must match a NotificationProvider id.
baakio.notifications.routing.sms-provider=${SMS_NOTIFICATION_PROVIDER:fast2sms}
baakio.notifications.routing.whatsapp-provider=${WHATSAPP_NOTIFICATION_PROVIDER:fast2sms}
baakio.notifications.routing.email-provider=${EMAIL_NOTIFICATION_PROVIDER:smtp}

# Fast2SMS API endpoint; override with FAST2SMS_BASE_URL only when using a different environment.
baakio.notifications.fast2sms.base-url=${FAST2SMS_BASE_URL:https://www.fast2sms.com}


# Fast2SMS API key credential; keep it secret and provide it through FAST2SMS_API_KEY.
baakio.notifications.fast2sms.api-key=${FAST2SMS_API_KEY:}
# Provider-issued SMS OTP template ID; set through FAST2SMS_OTP_TEMPLATE_ID.
baakio.notifications.fast2sms.otp-template-id=${FAST2SMS_OTP_TEMPLATE_ID:}


# Optional OTP variable format expected by the SMS template; {otp} is replaced with the generated code.
baakio.notifications.fast2sms.otp-variables-template=${FAST2SMS_OTP_VARIABLES_TEMPLATE:}
baakio.notifications.fast2sms.quick-sms-route=${FAST2SMS_QUICK_SMS_ROUTE:q}
baakio.notifications.fast2sms.whatsapp-version=${FAST2SMS_WHATSAPP_VERSION:v26.0}

# Provider-assigned WhatsApp phone-number ID; set through FAST2SMS_WHATSAPP_PHONE_NUMBER_ID.
baakio.notifications.fast2sms.whatsapp-phone-number-id=${FAST2SMS_WHATSAPP_PHONE_NUMBER_ID:}
# Approved provider WhatsApp template name used for OTP delivery.
baakio.notifications.fast2sms.whatsapp-otp-template-name=${FAST2SMS_WHATSAPP_OTP_TEMPLATE_NAME:}
baakio.notifications.fast2sms.whatsapp-otp-button-index=${FAST2SMS_WHATSAPP_OTP_BUTTON_INDEX:}

# Sender address shown on outgoing email; set through NOTIFICATION_EMAIL_FROM.
baakio.notifications.email.from=${NOTIFICATION_EMAIL_FROM:}
