spring.application.name=baakio
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=12h

# Production database connection; supply all three DB_* settings from the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

# Shared defaults for all Spring-managed HTTP clients.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=10s

baakio.frontend-origin=${FRONTEND_ORIGIN}

# Required production secret used to hash OTP codes before they are stored.
baakio.auth.otp.hash-secret=${OTP_HASH_SECRET}
baakio.auth.otp.expires-seconds=${OTP_EXPIRES_SECONDS:300}
baakio.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
baakio.auth.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
baakio.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}


baakio.auth.otp.expose-development-code=false
baakio.notifications.otp-channel=${OTP_CHANNEL:SMS}


# Provider ID selected for each channel; each value must match a NotificationProvider id.
baakio.notifications.routing.sms-provider=${SMS_NOTIFICATION_PROVIDER:fast2sms}
baakio.notifications.routing.whatsapp-provider=${WHATSAPP_NOTIFICATION_PROVIDER:fast2sms}
baakio.notifications.routing.email-provider=${EMAIL_NOTIFICATION_PROVIDER:smtp}

# Fast2SMS API endpoint; override with FAST2SMS_BASE_URL only when using a different environment.
baakio.notifications.fast2sms.base-url=${FAST2SMS_BASE_URL:https://www.fast2sms.com}


# Fast2SMS API key credential; keep it secret and provide it through FAST2SMS_API_KEY.
baakio.notifications.fast2sms.api-key=${FAST2SMS_API_KEY:}
# Provider-issued SMS OTP template ID; set through FAST2SMS_OTP_TEMPLATE_ID.
baakio.notifications.fast2sms.otp-template-id=${FAST2SMS_OTP_TEMPLATE_ID:}


# Optional OTP variable format expected by the SMS template; {otp} is replaced with the generated code.
baakio.notifications.fast2sms.otp-variables-template=${FAST2SMS_OTP_VARIABLES_TEMPLATE:}
baakio.notifications.fast2sms.quick-sms-route=${FAST2SMS_QUICK_SMS_ROUTE:q}
baakio.notifications.fast2sms.whatsapp-version=${FAST2SMS_WHATSAPP_VERSION:v26.0}

# Provider-assigned WhatsApp phone-number ID; set through FAST2SMS_WHATSAPP_PHONE_NUMBER_ID.
baakio.notifications.fast2sms.whatsapp-phone-number-id=${FAST2SMS_WHATSAPP_PHONE_NUMBER_ID:}
# Approved provider WhatsApp template name used for OTP delivery.
baakio.notifications.fast2sms.whatsapp-otp-template-name=${FAST2SMS_WHATSAPP_OTP_TEMPLATE_NAME:}
baakio.notifications.fast2sms.whatsapp-otp-button-index=${FAST2SMS_WHATSAPP_OTP_BUTTON_INDEX:}

# Sender address shown on outgoing email; set through NOTIFICATION_EMAIL_FROM.
baakio.notifications.email.from=${NOTIFICATION_EMAIL_FROM:}
