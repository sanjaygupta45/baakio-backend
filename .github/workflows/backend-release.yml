name: Backend release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: bom.ocir.io
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: bom.ocir.io/bmqc9sofhut1/baakio/backend:${{ github.sha }}
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=bom.ocir.io/bmqc9sofhut1/baakio/backend@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, X64, baakio-backend]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Release immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          install -m 600 deploy/compose.prod.yaml /opt/baakio/compose.prod.yaml
          install -m 600 deploy/Caddyfile /opt/baakio/Caddyfile
          install -m 700 deploy/release.sh /opt/baakio/release.sh
          install -m 700 deploy/backup-db.sh /opt/baakio/backup-db.sh
          /opt/baakio/release.sh "$IMAGE"
