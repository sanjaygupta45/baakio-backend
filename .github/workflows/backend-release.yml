name: Backend release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: echo "ref=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/backend@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, X64, baakio-backend]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Release immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          install -m 600 deploy/compose.prod.yaml /opt/baakio/compose.prod.yaml
          install -m 600 deploy/Caddyfile /opt/baakio/Caddyfile
          install -m 700 deploy/release.sh /opt/baakio/release.sh
          /opt/baakio/release.sh "$IMAGE"
