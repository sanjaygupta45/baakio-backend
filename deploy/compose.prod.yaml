services:
  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable digest}
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://${DB_HOST:?Set Aiven DB_HOST}:${DB_PORT:?Set Aiven DB_PORT}/${DB_NAME:?Set Aiven DB_NAME}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/run/baakio/aiven-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD:?Set AIVEN_TRUSTSTORE_PASSWORD}&connectionTimeZone=UTC
      DB_HOST: ${DB_HOST:?Set Aiven DB_HOST}
      DB_PORT: ${DB_PORT:?Set Aiven DB_PORT}
      DB_NAME: ${DB_NAME:?Set Aiven DB_NAME}
      DB_USER: ${DB_USER:?Set Aiven DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set Aiven DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Set CloudAMQP RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Set CloudAMQP AMQPS port}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?Set CloudAMQP virtual host}
      RABBITMQ_USER: ${RABBITMQ_USER:?Set CloudAMQP user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set CloudAMQP password}
      RABBITMQ_SSL_ENABLED: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      COOKIE_SECURE: "true"
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set OTP_HASH_SECRET}
      OTP_CHANNEL: ${OTP_CHANNEL:-SMS}
      SMS_NOTIFICATION_PROVIDER: fast2sms
      WHATSAPP_NOTIFICATION_PROVIDER: fast2sms
      EMAIL_NOTIFICATION_PROVIDER: smtp
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      FAST2SMS_OTP_TEMPLATE_ID: ${FAST2SMS_OTP_TEMPLATE_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ${AIVEN_CA_HOST_PATH:?Set AIVEN_CA_HOST_PATH}:/run/baakio/aiven-ca.pem:ro
      - ${AIVEN_TRUSTSTORE_HOST_PATH:?Set AIVEN_TRUSTSTORE_HOST_PATH}:/run/baakio/aiven-truststore.p12:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [public]

  caddy:
    image: caddy:2.10-alpine
    profiles: [public]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      API_HOSTNAME: ${API_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [public]

networks:
  public:

volumes:
  caddy_data:
  caddy_config:
